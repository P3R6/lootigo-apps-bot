name: Button Style Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Send a style comparison to the admin
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, requests
          T = os.environ["TELEGRAM_BOT_TOKEN"]
          API = f"https://api.telegram.org/bot{T}"
          ADMIN = 5237328828

          styles = ["success", "danger", "primary", "secondary", "warning", "attention"]
          rows = [[{"text": f"Claim Now  ({s})",
                    "url": "https://example.com", "style": s}] for s in styles]
          rows.append([{"text": "Claim Now  (no style)", "url": "https://example.com"}])

          r = requests.post(f"{API}/sendMessage", data={
              "chat_id": ADMIN,
              "text": ("Button style comparison.\n"
                       "Tell Claude which one looks right for the apps channel."),
              "reply_markup": json.dumps({"inline_keyboard": rows}),
          }, timeout=20).json()

          print("accepted:", r.get("ok"))
          if not r.get("ok"):
              print("error:", r.get("description"))
          else:
              for row in r["result"]["reply_markup"]["inline_keyboard"]:
                  b = row[0]
                  print(f"  {b['text']:<28} style echoed: {b.get('style', 'NONE')}")
          PY
